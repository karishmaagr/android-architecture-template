[versions]
agp                     = "8.5.2"
kotlin                  = "2.0.0"
ksp                     = "2.0.0-1.0.21"
hilt                    = "2.51.1"
hiltNavigationCompose   = "1.2.0"

# AndroidX
coreKtx                 = "1.13.1"
lifecycle               = "2.8.4"
activityCompose         = "1.9.1"
navigationCompose       = "2.7.7"
workManager             = "2.9.1"
dataStore               = "1.1.1"
room                    = "2.6.1"

# Compose
composeBom              = "2024.10.01"

# Networking
retrofit                = "2.11.0"
okhttp                  = "4.12.0"
moshi                   = "1.15.1"

# Image
coil                    = "2.7.0"

# Coroutines
coroutines              = "1.8.1"

# Testing
junit                   = "4.13.2"
junitExt                = "1.2.1"
espresso                = "3.6.1"
turbine                 = "1.1.0"
mockk                   = "1.13.12"
truth                   = "1.4.4"
coroutinesTest          = "1.8.1"
robolectric             = "4.13"
composeUiTest           = "1.7.0"

[libraries]
# AndroidX Core
androidx-core-ktx                   = { group = "androidx.core",                    name = "core-ktx",                      version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle",               name = "lifecycle-runtime-ktx",         version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx    = { group = "androidx.lifecycle",               name = "lifecycle-viewmodel-ktx",       version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose= { group = "androidx.lifecycle",               name = "lifecycle-viewmodel-compose",   version.ref = "lifecycle" }
androidx-activity-compose           = { group = "androidx.activity",                name = "activity-compose",              version.ref = "activityCompose" }
androidx-navigation-compose         = { group = "androidx.navigation",              name = "navigation-compose",            version.ref = "navigationCompose" }
androidx-work-runtime-ktx           = { group = "androidx.work",                    name = "work-runtime-ktx",              version.ref = "workManager" }
androidx-datastore-preferences      = { group = "androidx.datastore",              name = "datastore-preferences",         version.ref = "dataStore" }

# Compose BOM
compose-bom                         = { group = "androidx.compose",                 name = "compose-bom",                   version.ref = "composeBom" }
compose-ui                          = { group = "androidx.compose.ui",              name = "ui" }
compose-ui-graphics                 = { group = "androidx.compose.ui",              name = "ui-graphics" }
compose-ui-tooling-preview          = { group = "androidx.compose.ui",              name = "ui-tooling-preview" }
compose-material3                   = { group = "androidx.compose.material3",       name = "material3" }
compose-ui-tooling                  = { group = "androidx.compose.ui",              name = "ui-tooling" }
compose-ui-test-manifest            = { group = "androidx.compose.ui",              name = "ui-test-manifest" }
compose-ui-test-junit4              = { group = "androidx.compose.ui",              name = "ui-test-junit4" }

# Room
room-runtime                        = { group = "androidx.room",                    name = "room-runtime",                  version.ref = "room" }
room-ktx                            = { group = "androidx.room",                    name = "room-ktx",                      version.ref = "room" }
room-compiler                       = { group = "androidx.room",                    name = "room-compiler",                 version.ref = "room" }
room-testing                        = { group = "androidx.room",                    name = "room-testing",                  version.ref = "room" }

# Hilt
hilt-android                        = { group = "com.google.dagger",                name = "hilt-android",                  version.ref = "hilt" }
hilt-compiler                       = { group = "com.google.dagger",                name = "hilt-android-compiler",         version.ref = "hilt" }
hilt-navigation-compose             = { group = "androidx.hilt",                    name = "hilt-navigation-compose",       version.ref = "hiltNavigationCompose" }
hilt-work                           = { group = "androidx.hilt",                    name = "hilt-work",                     version.ref = "hiltNavigationCompose" }
hilt-work-compiler                  = { group = "androidx.hilt",                    name = "hilt-compiler",                 version.ref = "hiltNavigationCompose" }

# Networking
retrofit                            = { group = "com.squareup.retrofit2",           name = "retrofit",                      version.ref = "retrofit" }
retrofit-moshi                      = { group = "com.squareup.retrofit2",           name = "converter-moshi",               version.ref = "retrofit" }
okhttp                              = { group = "com.squareup.okhttp3",             name = "okhttp",                        version.ref = "okhttp" }
okhttp-logging                      = { group = "com.squareup.okhttp3",             name = "logging-interceptor",           version.ref = "okhttp" }
moshi                               = { group = "com.squareup.moshi",              name = "moshi",                         version.ref = "moshi" }
moshi-kotlin                        = { group = "com.squareup.moshi",              name = "moshi-kotlin",                  version.ref = "moshi" }
moshi-kotlin-codegen                = { group = "com.squareup.moshi",              name = "moshi-kotlin-codegen",          version.ref = "moshi" }

# Coroutines
coroutines-android                  = { group = "org.jetbrains.kotlinx",            name = "kotlinx-coroutines-android",    version.ref = "coroutines" }
coroutines-core                     = { group = "org.jetbrains.kotlinx",            name = "kotlinx-coroutines-core",       version.ref = "coroutines" }

# Image
coil-compose                        = { group = "io.coil-kt",                       name = "coil-compose",                  version.ref = "coil" }

# Testing
junit                               = { group = "junit",                            name = "junit",                         version.ref = "junit" }
androidx-junit                      = { group = "androidx.test.ext",                name = "junit",                         version.ref = "junitExt" }
androidx-espresso-core              = { group = "androidx.test.espresso",           name = "espresso-core",                 version.ref = "espresso" }
turbine                             = { group = "app.cash.turbine",                 name = "turbine",                       version.ref = "turbine" }
mockk                               = { group = "io.mockk",                         name = "mockk",                         version.ref = "mockk" }
mockk-android                       = { group = "io.mockk",                         name = "mockk-android",                 version.ref = "mockk" }
truth                               = { group = "com.google.truth",                 name = "truth",                         version.ref = "truth" }
coroutines-test                     = { group = "org.jetbrains.kotlinx",            name = "kotlinx-coroutines-test",       version.ref = "coroutinesTest" }
robolectric                         = { group = "org.robolectric",                  name = "robolectric",                   version.ref = "robolectric" }

[plugins]
android-application     = { id = "com.android.application",            version.ref = "agp" }
android-library         = { id = "com.android.library",                version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",version.ref = "kotlin" }
hilt                    = { id = "com.google.dagger.hilt.android",     version.ref = "hilt" }
ksp                     = { id = "com.google.devtools.ksp",            version.ref = "ksp" }
kotlin-parcelize        = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }

[bundles]
compose                 = ["compose-ui", "compose-ui-graphics", "compose-ui-tooling-preview", "compose-material3"]
networking              = ["retrofit", "retrofit-moshi", "okhttp", "okhttp-logging", "moshi", "moshi-kotlin"]
room                    = ["room-runtime", "room-ktx"]
testing-unit            = ["junit", "mockk", "truth", "coroutines-test", "turbine"]
testing-android         = ["androidx-junit", "androidx-espresso-core", "mockk-android"]
